name: build-cronify

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # =====================
          # LINUX
          # =====================
          - os: ubuntu-24.04
            artifact_name: cronify-linux-x64
            binary_name: cronify
            archive_name: cronify-${{ github.ref_name }}-linux-x64.zip

          - os: ubuntu-24.04-arm
            artifact_name: cronify-linux-arm64
            binary_name: cronify
            archive_name: cronify-${{ github.ref_name }}-linux-arm64.zip

          # =====================
          # MACOS
          # =====================
          - os: macos-15
            artifact_name: cronify-macos-arm64
            binary_name: cronify
            archive_name: cronify-${{ github.ref_name }}-macos-arm64.zip

          - os: macos-15-intel
            artifact_name: cronify-macos-x64
            binary_name: cronify
            archive_name: cronify-${{ github.ref_name }}-macos-x64.zip

          # =====================
          # WINDOWS
          # =====================
          - os: windows-2025
            artifact_name: cronify-windows-x64
            binary_name: cronify.exe
            archive_name: cronify-${{ github.ref_name }}-windows-x64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build frontend
        working-directory: frontend
        run: |
          bun install
          bun run build

      - name: Build binary
        run: |
          mkdir -p dist
          bun build ./index.ts \
            --compile \
            --outfile ./dist/${{ matrix.binary_name }}

      # =====================
      # ZIP (linux + macos)
      # =====================
      - name: Create zip archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          zip ${{ matrix.archive_name }} ${{ matrix.binary_name }}

      # =====================
      # ZIP (windows)
      # =====================
      - name: Create zip archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/${{ matrix.binary_name }} `
            -DestinationPath dist/${{ matrix.archive_name }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.archive_name }}
          generate_release_notes: true

<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />

    <script>
      (() => {
        const stored = localStorage.getItem("cronify-theme");
        const mode =
          stored === "light" || stored === "dark" || stored === "system"
            ? stored
            : "dark";
        const resolved =
          mode === "system"
            ? window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark"
            : mode;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>

    <link href="./src/index.css" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171719" />
    <meta
      name="description"
      content="Cronify — a local task scheduler with a web dashboard and CLI."
    />
    <title>Cronify — local task scheduler</title>
  </head>
  <body class="m-0 p-0 h-dvh w-dvw">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
